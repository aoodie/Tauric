name: Publish deployment candidate
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: tauric-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  images:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: api
            dockerfile: deploy/Dockerfile.release-api
          - kind: worker
            dockerfile: deploy/Dockerfile.release-worker
          - kind: web
            dockerfile: deploy/Dockerfile.web
          - kind: openclaw
            dockerfile: deploy/Dockerfile.openclaw
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image identity
        id: identity
        env:
          REPOSITORY: ${{ github.repository }}
          KIND: ${{ matrix.kind }}
        run: |
          image="ghcr.io/${REPOSITORY,,}-${KIND}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Build and publish immutable source image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.identity.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.kind }}
          cache-to: type=gha,mode=max,scope=${{ matrix.kind }}
      - name: Record published digest
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          KIND: ${{ matrix.kind }}
          REVISION: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('image-digests').mkdir()
          Path('image-digests', os.environ['KIND'] + '.json').write_text(json.dumps({
              'image': os.environ['IMAGE'] + '@' + os.environ['DIGEST'],
              'revision': os.environ['REVISION'],
              'repository': os.environ['REPOSITORY'].lower(),
          }))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.kind }}
          path: image-digests/*.json
          retention-days: 14
  bundle:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          path: image-digests
          merge-multiple: true
      - name: Assemble server release
        env:
          REVISION: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: python scripts/release_bundle.py --images-dir image-digests --output artifacts/tauric-release --repository "$REPOSITORY" --revision "$REVISION"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Rehearse clean install and complete backup restoration
        run: python scripts/release_smoke.py --images artifacts/tauric-release/images.env --output artifacts/release-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tauric-deployment-${{ github.ref_name }}
          path: |
            artifacts/tauric-release.tar.gz
            artifacts/release-smoke.json
          retention-days: 90
