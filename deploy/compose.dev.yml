name: tauric_foundation
services:
  db:
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_DB: tauric
      POSTGRES_USER: tauric_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/dev_setup.py first}
      TAURIC_DB_PASSWORD: ${TAURIC_DB_PASSWORD:?Run scripts/dev_setup.py first}
    ports:
      - "127.0.0.1:${DB_PORT:-54330}:5432"
    volumes:
      - database:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-tauric.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tauric_admin -d tauric"]
      interval: 3s
      timeout: 3s
      retries: 20
    command: ["postgres", "-c", "max_connections=50"]
    mem_limit: 512m
    restart: unless-stopped
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      TAURIC_DATABASE_URL: postgresql+psycopg://tauric_admin:${POSTGRES_PASSWORD}@db:5432/tauric
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      TAURIC_DATABASE_URL: postgresql+psycopg://tauric_app:${TAURIC_DB_PASSWORD}@db:5432/tauric
      TAURIC_ALLOWED_ORIGINS: ${TAURIC_ALLOWED_ORIGINS:-["http://127.0.0.1:8080","http://localhost:8080"]}
      TAURIC_SECURE_COOKIES: "false"
    volumes:
      - ../.env.models.json:/run/setup-model-profiles.json:ro
      - ../.env.market-data.json:/run/setup-market-data.json:ro
      - ../.env.model-key:/run/setup-model-key:ro
      - ../.env.openclaw-private.json:/run/setup-openclaw-private.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 384m
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped
  worker:
    profiles: [analysis]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      TAURIC_DATABASE_URL: postgresql+psycopg://tauric_app:${TAURIC_DB_PASSWORD}@db:5432/tauric
      TAURIC_RUNTIME_DIRECTORY: /runtime
    volumes:
      - ../.env.models.json:/run/setup-model-profiles.json:ro
      - ../.env.model-key:/run/setup-model-key:ro
      - ../.env.openclaw-private.json:/run/setup-openclaw-private.json:ro
      - native_runtime:/runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 1g
    restart: unless-stopped
  openclaw:
    profiles: [governance]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.openclaw
    volumes:
      - ../.env.openclaw-private.json:/run/setup-openclaw-private.json:ro
      - openclaw_state:/state
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 1g
    restart: unless-stopped
  scanner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      TAURIC_DATABASE_URL: postgresql+psycopg://tauric_app:${TAURIC_DB_PASSWORD}@db:5432/tauric
      TAURIC_MARKET_CONNECTIONS_FILE: /run/tauric/market-data.json
    volumes:
      - ../.env.market-data.json:/run/setup-market-data.json:ro
      - ../.env.model-key:/run/setup-model-key:ro
    command: ["python", "-m", "tauric.scanner_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped
  candidate_research:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      TAURIC_DATABASE_URL: postgresql+psycopg://tauric_app:${TAURIC_DB_PASSWORD}@db:5432/tauric
      TAURIC_MODEL_PROFILES_FILE: /run/tauric/model-profiles.json
    volumes:
      - ../.env.models.json:/run/setup-model-profiles.json:ro
      - ../.env.model-key:/run/setup-model-key:ro
    command: ["python", "-m", "tauric.candidate_research_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from sqlalchemy.orm import Session; from tauric.database import engine; from tauric.models import WorkerStatus, now; db=Session(engine()); row=db.get(WorkerStatus,'candidate_research'); assert row and 0 <= (now()-row.heartbeat_at).total_seconds() < 30"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m
    restart: unless-stopped
  strategy_scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      TAURIC_DATABASE_URL: postgresql+psycopg://tauric_app:${TAURIC_DB_PASSWORD}@db:5432/tauric
    command: ["python", "-m", "tauric.strategy_scheduler_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from sqlalchemy.orm import Session; from tauric.database import engine; from tauric.strategy_scheduler import status; db=Session(engine()); assert status(db).ready"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m
    restart: unless-stopped
  broker_execution:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      TAURIC_DATABASE_URL: postgresql+psycopg://tauric_app:${TAURIC_DB_PASSWORD}@db:5432/tauric
    volumes:
      - ../.env.market-data.json:/run/setup-market-data.json:ro
      - ../.env.models.json:/run/setup-model-profiles.json:ro
      - ../.env.model-key:/run/setup-model-key:ro
      - ../.env.openclaw-private.json:/run/setup-openclaw-private.json:ro
    command: ["python", "-m", "tauric.broker_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from sqlalchemy.orm import Session; from tauric.database import engine; from tauric.models import WorkerStatus, now; db=Session(engine()); row=db.get(WorkerStatus, 'broker_execution'); assert row and (now()-row.heartbeat_at).total_seconds()<60"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 192m
    restart: unless-stopped
  autonomous_paper:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      TAURIC_DATABASE_URL: postgresql+psycopg://tauric_app:${TAURIC_DB_PASSWORD}@db:5432/tauric
    volumes:
      - ../.env.models.json:/run/setup-model-profiles.json:ro
      - ../.env.model-key:/run/setup-model-key:ro
      - ../.env.openclaw-private.json:/run/setup-openclaw-private.json:ro
    command: ["python", "-m", "tauric.autonomous_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from sqlalchemy.orm import Session; from tauric.database import engine; from tauric.models import WorkerStatus, now; db=Session(engine()); row=db.get(WorkerStatus, 'autonomous_paper'); assert row and (now()-row.heartbeat_at).total_seconds()<60"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m
    restart: unless-stopped
  portfolio_research:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      TAURIC_DATABASE_URL: postgresql+psycopg://tauric_app:${TAURIC_DB_PASSWORD}@db:5432/tauric
    volumes:
      - ../.env.market-data.json:/run/setup-market-data.json:ro
      - ../.env.models.json:/run/setup-model-profiles.json:ro
      - ../.env.model-key:/run/setup-model-key:ro
    command: ["python", "-m", "tauric.portfolio_research_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from sqlalchemy.orm import Session; from tauric.database import engine; from tauric.models import WorkerStatus, now; db=Session(engine()); row=db.get(WorkerStatus, 'portfolio_research'); assert row and (now()-row.heartbeat_at).total_seconds()<90"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m
    restart: unless-stopped
  chat_worker:
    profiles: [governance]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      TAURIC_DATABASE_URL: postgresql+psycopg://tauric_app:${TAURIC_DB_PASSWORD}@db:5432/tauric
    volumes:
      - ../.env.models.json:/run/setup-model-profiles.json:ro
      - ../.env.model-key:/run/setup-model-key:ro
      - ../.env.openclaw-private.json:/run/setup-openclaw-private.json:ro
    command: ["python", "-m", "tauric.chat_worker"]
    depends_on:
      openclaw:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped
  governance_worker:
    profiles: [governance]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      TAURIC_DATABASE_URL: postgresql+psycopg://tauric_app:${TAURIC_DB_PASSWORD}@db:5432/tauric
    volumes:
      - ../.env.models.json:/run/setup-model-profiles.json:ro
      - ../.env.model-key:/run/setup-model-key:ro
      - ../.env.openclaw-private.json:/run/setup-openclaw-private.json:ro
    command: ["python", "-m", "tauric.governance_worker"]
    depends_on:
      openclaw:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped
volumes:
  openclaw_state:
  database:
  native_runtime:
