        "TAURIC_SECURE_COOKIES": "${TAURIC_SECURE_COOKIES:-false}"
      },
      "secrets": [
        "database-app",
        {
          "source": "models",
          "target": "/run/tauric/model-profiles.json"
        },
        {
          "source": "market",
          "target": "/run/tauric/market-data.json"
        },
        {
          "source": "model-key",
          "target": "/run/tauric/model-key"
        },
        {
          "source": "openclaw-tokens",
          "target": "/run/tauric/openclaw-private.json"
        }
      ],
      "read_only": true,
      "tmpfs": [
        "/tmp:mode=1777,size=128m"
      ],
      "cap_drop": [
        "ALL"
      ],
      "stop_grace_period": "60s",
      "user": "10001:10001"
    },
