      "networks": {
        "default": null
      },
      "restart": "unless-stopped",
      "init": true,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "security_opt": [
        "no-new-privileges:true"
      ],
      "image": "${TAURIC_WORKER_IMAGE:?Set a digest-pinned native image}",
      "environment": {
        "TAURIC_DB_PASSWORD_FILE": "/run/secrets/database-app",
        "TAURIC_DB_USER": "tauric_app",
        "TAURIC_RUNTIME_DIRECTORY": "/runtime"
      },
      "secrets": [
        "database-app",
        {
          "source": "models",
          "target": "/run/tauric/model-profiles.json"
        },
        {
          "source": "model-key",
          "target": "/run/tauric/model-key"
        },
        {
          "source": "openclaw-tokens",
          "target": "/run/tauric/openclaw-private.json"
        }
      ],
      "read_only": true,
      "tmpfs": [
        "/tmp:mode=1777,size=128m"
      ],
      "cap_drop": [
        "ALL"
      ],
      "profiles": [
        "analysis"
      ],
      "volumes": [
        "native_runtime:/runtime"
      ],
      "stop_grace_period": "1250s",
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "from sqlalchemy import text; from tauric.database import engine; c=engine().connect(); assert c.scalar(text(\"SELECT heartbeat_at <= now() AND heartbeat_at > now() - (:max_age * interval '1 second') FROM worker_status WHERE id = :worker\"), {'worker': 'native', 'max_age': 90}) is True"
        ],
        "interval": "15s",
        "timeout": "10s",
        "retries": 6,
        "start_period": "90s"
      },
      "user": "10001:10001"
    }
  },
  "secrets": {
    "database-admin": {
      "file": "${TAURIC_SECRETS_DIR:?Set the private secrets directory}/database-admin"
    },
    "database-app": {
      "file": "${TAURIC_SECRETS_DIR:?Set the private secrets directory}/database-app"
    },
    "models": {
      "file": "${TAURIC_SECRETS_DIR:?Set the private secrets directory}/model-profiles.json"
    },
    "market": {
      "file": "${TAURIC_SECRETS_DIR:?Set the private secrets directory}/market-data.json"
    },
    "model-key": {
      "file": "${TAURIC_SECRETS_DIR:?Set the private secrets directory}/model-key"
    },
    "openclaw-tokens": {
      "file": "${TAURIC_SECRETS_DIR:?Set the private secrets directory}/openclaw-private.json"
    }
  },
  "volumes": {
    "database": {},
    "native_runtime": {},
    "openclaw_state": {},
    "caddy_data": {},
    "caddy_config": {}
  }
}
